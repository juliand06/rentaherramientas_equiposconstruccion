spring:
  application:
    name: rentatools
  profiles:
    # El perfil activo viene de la variable de entorno; dev por defecto solo en local.
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # Sin valores por defecto: la conexión SIEMPRE viene de variables de entorno.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway. Hibernate solo VALIDA que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Lista separada por comas. Sin "*" fijo en el código.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # Sin valor por defecto: la aplicación no arranca sin secreto.
    secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  storage:
    uploads-dir: ${UPLOADS_DIR:./uploads}
